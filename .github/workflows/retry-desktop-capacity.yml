name: Retry unavailable desktop runner
on:
  workflow_run:
    workflows: ['Desktop release']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: desktop-capacity-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const { retryDesktopCapacity } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/retry-desktop-capacity.mjs`);
            await retryDesktopCapacity({ github, context, core });
