packages:
  - apps/*
  - packages/*
# Exact versions already installed by npm before migrating to pnpm.
minimumReleaseAgeExclude:
  - '@babel/helper-string-parser@7.29.11'
  - '@babel/parser@7.29.11'
  - '@babel/types@7.29.11'
  - 'baseline-browser-mapping@2.11.32'
  - 'electron-to-chromium@1.5.464'
  - 'exifreader@4.52.0'
  - 'ignore@7.0.14'
# The published browser bundle is used; no dependency build is required.
allowBuilds:
  esbuild: true
  electron: true
  exifreader: false
